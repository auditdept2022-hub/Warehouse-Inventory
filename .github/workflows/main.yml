name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Motorlandia project
        shell: bash
        run: |
          if [ -f package.json ] && [ -f index.html ]; then
            APP_DIR="."
          elif [ -f Motorlandia_App/package.json ] && [ -f Motorlandia_App/index.html ]; then
            APP_DIR="Motorlandia_App"
          else
            echo "::error::Cannot find package.json and index.html in the repository root or Motorlandia_App/ folder. Upload the project files to the repository root."
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Using project folder: $APP_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f index.html || { echo "index.html is missing"; exit 1; }
          test -f capacitor.config.json || { echo "capacitor.config.json is missing"; exit 1; }
          test -d icons || { echo "icons/ folder is missing"; exit 1; }
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          rm -rf www/icons
          cp -r icons www/icons

      - name: Add Android platform
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Add camera permission for plate scanning
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          F="android/app/src/main/AndroidManifest.xml"
          test -f "$F" || { echo "AndroidManifest.xml was not generated"; exit 1; }
          if ! grep -q 'android.permission.CAMERA' "$F"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$F"
          fi

      - name: Generate Android app icons
        working-directory: ${{ env.APP_DIR }}
        run: npx capacitor-assets generate --android || echo "Icon generation skipped; using default Android icons."

      - name: Sync Capacitor project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motorlandia-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
